[project]
name = "pitchline"
version = "0.1.0"
description = "football analytics pipeline: raw event data → canonical schema → match and scouting reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kloppy>=3.19.1",
    "pandera[pandas]>=0.35.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
